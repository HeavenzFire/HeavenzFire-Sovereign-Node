name: UIM and Control Relay Contract Tests

on:
  push:
    paths:
      - "runtime/uim/**"
      - "runtime/unified_hub/**"
      - "runtime/control_relay/**"
      - ".github/workflows/uim-registry-tests.yml"
  pull_request:
    paths:
      - "runtime/uim/**"
      - "runtime/unified_hub/**"
      - "runtime/control_relay/**"
      - ".github/workflows/uim-registry-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run UIM adapter and registry tests
        run: python -m unittest discover -s runtime/uim -v
      - name: Run Unified Hub route tests
        run: python -m unittest discover -s runtime/unified_hub -v
      - name: Run relay safety contract tests
        run: python -m unittest discover -s runtime/control_relay -v
